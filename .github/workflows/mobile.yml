name: Mobile

on:
  pull_request:
    paths:
      - '.github/workflows/mobile.yml'
      - 'mobile/**'
      - '!mobile/spikes/**'
      - 'rotkehlchen/errors/serialization.py'
      - 'rotkehlchen/fval.py'
      - 'tools/scripts/generate_companion_protocol_vocabulary.py'
  push:
    branches:
      - main
      - master
      - develop
      - bugfixes
      - 'feature/**'
    paths:
      - '.github/workflows/mobile.yml'
      - 'mobile/**'
      - '!mobile/spikes/**'
      - 'rotkehlchen/errors/serialization.py'
      - 'rotkehlchen/fval.py'
      - 'tools/scripts/generate_companion_protocol_vocabulary.py'
  workflow_dispatch: { }

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions: { }

jobs:
  android:
    name: 'Shared JVM and Android'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14.4'

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95  # v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Install Android compile SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-37.0' \
            'build-tools;36.0.0'

      - name: Verify generated mobile contracts
        run: |
          python mobile/core/model/tools/generate_exact_decimal_vectors.py
          python tools/scripts/generate_companion_protocol_vocabulary.py --check
          python mobile/shared/tools/generate_companion_protocol_fixtures.py --check

      - name: Kotlin static analysis
        working-directory: mobile
        run: ./gradlew --no-daemon --continue qualityCheck

      - name: Upload Kotlin static-analysis reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: kotlin-static-analysis
          path: |
            mobile/**/build/reports/ktlint/**
            mobile/**/build/reports/detekt/**
          if-no-files-found: warn
          retention-days: 14

      - name: Verify non-UI KMP modules have no UI dependencies
        working-directory: mobile
        run: |
          ./gradlew --no-daemon \
            :core:common:dependencies \
            :core:model:dependencies \
            :core:network:dependencies \
            :core:protocol:dependencies \
            :core:security-api:dependencies \
            :core:testing:dependencies \
            :feature:pairing:data:dependencies \
            :feature:pairing:domain:dependencies \
            :feature:pairing:presentation:dependencies \
            :shared:dependencies \
            > "$RUNNER_TEMP/non-ui-kmp-dependencies.txt"
          if grep -E 'androidx\.compose|org\.jetbrains\.compose' \
            "$RUNNER_TEMP/non-ui-kmp-dependencies.txt"; then
            echo '::error::UI dependencies are forbidden in non-UI KMP modules'
            exit 1
          fi

      - name: Run KMP and Android gates
        working-directory: mobile
        run: ./gradlew --no-daemon mobileCheck

      - name: Verify Android platform AAR boundary
        working-directory: mobile
        run: |
          aar='android/platform/build/outputs/aar/platform-debug.aar'
          classes_jar="$RUNNER_TEMP/android-platform-classes.jar"
          manifest="$RUNNER_TEMP/android-platform-AndroidManifest.xml"
          public_api="$RUNNER_TEMP/android-platform-public-api.txt"
          lifecycle_api="$RUNNER_TEMP/android-companion-lifecycle-api.txt"
          lifecycle_holder_api="$RUNNER_TEMP/android-companion-lifecycle-holder-api.txt"
          record_holder_api="$RUNNER_TEMP/android-pairing-record-store-api.txt"
          cleanup_holder_api="$RUNNER_TEMP/android-pairing-cleanup-journal-api.txt"
          device_proof_holder_api="$RUNNER_TEMP/android-device-proof-signer-api.txt"
          idempotency_holder_api="$RUNNER_TEMP/android-idempotency-key-generator-api.txt"
          r_txt="$RUNNER_TEMP/android-platform-R.txt"
          test -f "$aar"

          actual_entries="$(unzip -Z1 "$aar" | LC_ALL=C sort)"
          expected_entries="$(
            printf '%s\n' \
              'AndroidManifest.xml' \
              'META-INF/com/android/build/gradle/aar-metadata.properties' \
              'R.txt' \
              'classes.jar' \
              | LC_ALL=C sort
          )"
          if [[ "$actual_entries" != "$expected_entries" ]]; then
            echo '::error::Unexpected files or resources leaked into the Android platform AAR'
            diff <(printf '%s\n' "$expected_entries") <(printf '%s\n' "$actual_entries") || true
            exit 1
          fi

          unzip -p "$aar" R.txt > "$r_txt"
          if [[ -s "$r_txt" ]]; then
            echo '::error::Android platform resources leaked into R.txt'
            cat "$r_txt"
            exit 1
          fi

          unzip -p "$aar" AndroidManifest.xml > "$manifest"
          python3 - "$manifest" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          manifest = ET.parse(sys.argv[1]).getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          expected_uses_sdk = {f"{android}minSdkVersion": "28"}
          children = list(manifest)
          if (
              manifest.tag != "manifest"
              or manifest.attrib != {"package": "org.rotki.mobile.android.platform"}
              or len(children) != 1
              or children[0].tag != "uses-sdk"
              or children[0].attrib != expected_uses_sdk
              or list(children[0])
          ):
              raise SystemExit(
                  "Android platform components, permissions, features, or attributes "
                  "leaked into the AAR manifest"
              )
          PY

          unzip -p "$aar" classes.jar > "$classes_jar"
          while IFS= read -r class_entry; do
            class_name="${class_entry%.class}"
            class_name="${class_name//\//.}"
            javap -classpath "$classes_jar" -public "$class_name"
          done < <(jar tf "$classes_jar" | grep -E '\.class$' | LC_ALL=C sort) > "$public_api"

          actual_public_types="$(
            grep -E '^public (.* )?(class|interface|enum) ' "$public_api" \
              | sed 's/ {$//' \
              | LC_ALL=C sort -u
          )"
          expected_public_types="$(
            printf '%s\n' \
              'public final class org.rotki.mobile.android.lifecycle.AndroidCompanionLifecycleKt' \
              'public final class org.rotki.mobile.android.security.AndroidDeviceProofSignerKt' \
              'public final class org.rotki.mobile.android.security.AndroidIdempotencyKeyGeneratorKt' \
              'public final class org.rotki.mobile.android.storage.AndroidPairingCleanupJournalKt' \
              'public final class org.rotki.mobile.android.storage.AndroidPairingRecordStoreKt' \
              'public interface org.rotki.mobile.android.lifecycle.AndroidCompanionLifecycle' \
              | LC_ALL=C sort
          )"
          if [[ "$actual_public_types" != "$expected_public_types" ]]; then
            echo '::error::Android platform public JVM type boundary changed'
            diff \
              <(printf '%s\n' "$expected_public_types") \
              <(printf '%s\n' "$actual_public_types") \
              || true
            exit 1
          fi

          resume_method='public abstract void onResume();'
          pause_method='public abstract void onPause();'
          background_method='public abstract void onBackgroundOrSystemLock();'
          lifecycle_factory='public static final org.rotki.mobile.android.lifecycle.AndroidCompanionLifecycle createAndroidCompanionLifecycle(org.rotki.mobile.core.ports.ApplicationVisibilityController, kotlin.jvm.functions.Function0<kotlin.Unit>, kotlin.jvm.functions.Function0<kotlin.Unit>, kotlin.jvm.functions.Function0<kotlin.Unit>, kotlin.jvm.functions.Function0<kotlin.Unit>);'
          javap -classpath "$classes_jar" -public \
            org.rotki.mobile.android.lifecycle.AndroidCompanionLifecycle \
            > "$lifecycle_api"
          javap -classpath "$classes_jar" -public \
            org.rotki.mobile.android.lifecycle.AndroidCompanionLifecycleKt \
            > "$lifecycle_holder_api"
          if [[ "$(grep -Ec '^  public ' "$lifecycle_api")" -ne 3 ]] || \
             [[ "$(grep -Fc "$resume_method" "$lifecycle_api")" -ne 1 ]] || \
             [[ "$(grep -Fc "$pause_method" "$lifecycle_api")" -ne 1 ]] || \
             [[ "$(grep -Fc "$background_method" "$lifecycle_api")" -ne 1 ]] || \
             [[ "$(grep -Ec '^  public ' "$lifecycle_holder_api")" -ne 1 ]] || \
             [[ "$(grep -Fc "$lifecycle_factory" "$lifecycle_holder_api")" -ne 1 ]]; then
            echo '::error::Android platform lifecycle API changed'
            cat "$lifecycle_api" "$lifecycle_holder_api"
            exit 1
          fi

          record_factory='public static final org.rotki.mobile.core.ports.PairingRecordStore createAndroidPairingRecordStore(android.content.Context);'
          cleanup_factory='public static final org.rotki.mobile.core.ports.PairingCleanupJournal createAndroidPairingCleanupJournal(android.content.Context);'
          javap -classpath "$classes_jar" -public \
            org.rotki.mobile.android.storage.AndroidPairingRecordStoreKt \
            > "$record_holder_api"
          javap -classpath "$classes_jar" -public \
            org.rotki.mobile.android.storage.AndroidPairingCleanupJournalKt \
            > "$cleanup_holder_api"
          if [[ "$(grep -Ec '^  public ' "$record_holder_api")" -ne 1 ]] || \
             [[ "$(grep -Fc "$record_factory" "$record_holder_api")" -ne 1 ]] || \
             [[ "$(grep -Ec '^  public ' "$cleanup_holder_api")" -ne 1 ]] || \
             [[ "$(grep -Fc "$cleanup_factory" "$cleanup_holder_api")" -ne 1 ]]; then
            echo '::error::Android platform storage factory API changed'
            cat "$record_holder_api" "$cleanup_holder_api"
            exit 1
          fi

          device_proof_factory='public static final org.rotki.mobile.core.ports.DeviceProofSigner createAndroidDeviceProofSigner();'
          idempotency_factory='public static final org.rotki.mobile.core.ports.IdempotencyKeyGenerator createAndroidIdempotencyKeyGenerator();'
          javap -classpath "$classes_jar" -public \
            org.rotki.mobile.android.security.AndroidDeviceProofSignerKt \
            > "$device_proof_holder_api"
          javap -classpath "$classes_jar" -public \
            org.rotki.mobile.android.security.AndroidIdempotencyKeyGeneratorKt \
            > "$idempotency_holder_api"
          if [[ "$(grep -Ec '^  public ' "$device_proof_holder_api")" -ne 1 ]] || \
             [[ "$(grep -Fc "$device_proof_factory" "$device_proof_holder_api")" -ne 1 ]] || \
             [[ "$(grep -Ec '^  public ' "$idempotency_holder_api")" -ne 1 ]] || \
             [[ "$(grep -Fc "$idempotency_factory" "$idempotency_holder_api")" -ne 1 ]]; then
            echo '::error::Android platform security factory API changed'
            cat "$device_proof_holder_api" "$idempotency_holder_api"
            exit 1
          fi

  android-security:
    name: 'Android security (${{ matrix.label }})'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 'API 28 floor'
            task: pixel2Api28DevDebugAndroidTest
            platform_task: pixel2Api28DebugAndroidTest
            system-image: 'system-images;android-28;google_apis;x86_64'
            artifact: api28
          - label: 'API 36 stable'
            task: pixel8Api36DevDebugAndroidTest
            platform_task: pixel8Api36DebugAndroidTest
            system-image: 'system-images;android-36;google_apis;x86_64'
            artifact: api36
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95  # v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Install Android device image and compile SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-37.0' \
            'build-tools;36.0.0' \
            '${{ matrix.system-image }}'

      - name: Enable emulator acceleration
        run: |
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android security and platform storage instrumentation
        working-directory: mobile
        run: |
          ./gradlew --no-daemon \
            ':androidApp:${{ matrix.task }}' \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          ./gradlew --no-daemon \
            ':android:platform:${{ matrix.platform_task }}' \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Upload Android security and platform results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: android-security-${{ matrix.artifact }}
          path: |
            mobile/androidApp/build/reports/androidTests/managedDevice/**
            mobile/androidApp/build/outputs/androidTest-results/managedDevice/**
            mobile/android/platform/build/reports/androidTests/managedDevice/**
            mobile/android/platform/build/outputs/androidTest-results/managedDevice/**
          if-no-files-found: warn
          retention-days: 14

  apple:
    name: 'Shared iOS'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95  # v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Select supported Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.4.app/Contents/Developer

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Run iOS gates
        working-directory: mobile
        run: ./gradlew --no-daemon appleCheck

      - name: Verify Kotlin internals stay out of Swift
        working-directory: mobile
        run: |
          device_header='shared/build/bin/iosArm64/debugFramework/RotkiShared.framework/Headers/RotkiShared.h'
          simulator_header='shared/build/bin/iosSimulatorArm64/debugFramework/RotkiShared.framework/Headers/RotkiShared.h'
          cmp "$device_header" "$simulator_header"
          forbidden_pattern='CompanionJsonCodec|DuplicateJsonMember|hasValidJsonSyntax|isCanonicalFixedBase64Url|bytesCopy|StrictJson|GeneratedProtocolVocabulary|Protocol(ClientInputLimits|Headers|LifetimesSeconds|EncodedLengths|RetryPolicy|Capability|AuthRealm|Authority|ErrorAction|RootState)|DeviceSessionState|HttpErrorCode|OperationErrorCode|CompanionPlatform|SourceErrorCode|WebSocketEventType|PairingId|PairingCredential|ChallengeId|ChallengeNonce|AccessSessionCredential|PROTOCOL_VOCABULARY_SCHEMA_VERSION|SUPPORTED_PROTOCOL_VERSIONS|WEBSOCKET_CLOSE_CODES|DEVICE_PROOF_ALGORITHM'
          forbidden_pattern+='|CompanionEnvelopeDecoder|CompanionEnvelopeDecodeOutcome|CompanionEnvelopeShape|CompanionErrorDto|CompanionFailureEnvelopeDto|CompanionFailureLocalEffect|CompanionFailure'
          forbidden_pattern+='|ProtocolDiscoveryEnvelopeDto|ProtocolDiscoveryResultDto|ProtocolNegotiationOutcome|decodeSuccess|decodeFailure|negotiate|toDomain'
          forbidden_pattern+='|WebSocketNotificationDecoder|WebSocketNotificationDecodeOutcome|WebSocketNotificationDto|CompanionNotification|SnapshotRevisionAvailable|SnapshotRevisionDataDto'
          forbidden_pattern+='|RefreshOperationNotification|RefreshTarget|RefreshOperationState|RefreshProgress|RefreshOperationError|RefreshOperationChanged|RefreshOperationDataDto|RefreshProgressDto|RefreshOperationErrorDto'
          forbidden_pattern+='|createCompanionHttpClient|createPlatformCompanionHttpClient|createPlatformHttpClientEngine|executeCompanionSuccessEnvelope|executeCompanionFailureEnvelope|executeCompanionResponse'
          forbidden_pattern+='|CompanionHttpResponseOutcome|BoundedControlResponseBodyOutcome|readBoundedControlResponseText|hasStrictJsonContentType|isTransportFailure'
          forbidden_pattern+='|RequestReplayPolicy|RetryFailure|TypedErrorRetryDisposition|RetryDecision|RetryStopReason|RetryJitterSource|DefaultRetryJitterSource|RetryPolicy'
          forbidden_pattern+='|SessionRenewalDecision|SessionRenewalPolicy|SessionRenewalGate|SessionRenewalLease'
          forbidden_pattern+='|HttpClientEngine|HttpClient|HttpStatement|HttpResponse|ByteReadChannel|OutgoingContent|io_ktor|Ktor|ktor'
          forbidden_pattern+='|PairingQr(Parser|ParseOutcome|Rejection|Dto)?|createPairingSubmissionGateway|PairingProtocolClient|createPairingProtocolClient|PairingRegistrationRequest|createPairingRegistrationRequest|PairingDiscoveryOutcome|PairingRegistrationRemote(Gateway|Outcome)|createPlatformPairingRegistrationRemoteGateway|PairingRegisteredSession|PairingProtocolRoutes?|CompanionJsonContent'
          forbidden_pattern+='|RegisterDeviceSessionRequestDto|DeviceSession(Result|Envelope)?Dto|DeviceLabelParseOutcome|AuthContractOutcome|encodeCompanionJson|matchesRegistration|isValidDeviceLabel|parse(DeviceLabel|PairingDeviceLabel)'
          forbidden_pattern+='|org_koin|io_insert_koin|Koin(Component|Application|Module|Scope|ViewModel)?|startKoin|koinViewModel|RotkiCompanionApplication|AndroidSecurityComposition|androidAppModule|viewModelOf|singleOf'
          forbidden_pattern+='|androidx_navigation|org_rotki_mobile_android_navigation|AndroidNavigation|Nav(Host(Controller)?|Controller|BackStackEntry)|OverviewRoute|PortfolioRoute|HistoryRoute|SourcesRoute|HomeDestination|HomeNavHost|CompanionHome|HomeConnectionBanner(State)?'
          forbidden_pattern+='|org_rotki_mobile_android_platform|AndroidPlatform|AndroidCompanionLifecycle|createAndroidCompanionLifecycle|DefaultAndroidCompanionLifecycle|CompanionLifecycleController'
          forbidden_pattern+='|org_rotki_mobile_android_storage|AndroidPairing(RecordStore|CleanupJournal|Storage)|createAndroidPairing(RecordStore|CleanupJournal)|PairingRecord(Codec|DecodeOutcome)|pairing-record\.bin|pairing-cleanup\.marker|rotki-pairing-cleanup-v1'
          forbidden_pattern+='|org_rotki_mobile_android_security|createAndroid(DeviceProofSigner|IdempotencyKeyGenerator)|Android(DeviceProofSigner|IdempotencyKeyGenerator|SigningKey(Store|Material)|P256Encoding)|DeviceSigningKeyStore|IdempotencyRandomFill'
          forbidden_pattern+='|ANDROID_DEVICE_PROOF_SIGNING_ALIAS|ANDROID_KEY_STORE_PROVIDER|SIGNATURE_ALGORITHM|P256_CURVE_NAME|P256_KEY_SIZE_BITS|CERTIFICATE_SUBJECT|CERTIFICATE_NOT_(BEFORE|AFTER)_MILLIS|IDEMPOTENCY_KEY_BYTE_COUNT|GENERATION_FAILURE_MESSAGE'
          forbidden_pattern+='|rotki_companion_device_proof_signing_v1|AndroidKeyStore|SHA256withECDSA|secp256r1|CN=rotki Companion Device Key'
          forbidden_pattern+='|swift_name\("DeviceSession"\)|swift_name\("DeviceLabel"\)'
          if grep -En "$forbidden_pattern" "$device_header" "$simulator_header"; then
            echo '::error::Kotlin-only protocol/network/Pairing or Android DI/navigation/platform internals leaked into the Swift framework header'
            exit 1
          fi
          required_swift_names=(
            CompanionFacade
            CompanionFacade.Companion
            PairingConnection
            PairingConnection.Companion
            PairingConnectionConfiguration
            PairingConnectionOutcome
            PairingDevicePlatform
            PairingFlow
            PairingPresentation
            PairingRejectionCategory
            PairingUiState
            DeviceLabelValidator
            DeviceSessionId
            IdempotencyKey
            IdempotencyKeyGenerator
            P1363Signature
            X963PublicKey
            ProtocolValueParseOutcome
            ProtocolValueParseOutcomeAccepted
            ProtocolValueParseOutcomeRejected
            ProtocolValueRejection
            EngineOrigin
            EngineOrigin.Companion
            EngineOriginParseOutcome
            EngineOriginParseOutcomeAccepted
            EngineOriginParseOutcomeRejected
            EngineOriginRejection
            DeviceProofKeyDeleteOutcome
            DeviceProofKeyDeleteOutcomeDeleted
            DeviceProofKeyDeleteOutcomeUnavailable
            DeviceProofPublicKeyOutcome
            DeviceProofPublicKeyOutcomePairingRequired
            DeviceProofPublicKeyOutcomePublicKey
            DeviceProofPublicKeyOutcomeUnexpectedFailure
            DeviceProofSigner
            DeviceProofSigningOutcome
            DeviceProofSigningOutcomeDeviceAuthenticationCancelled
            DeviceProofSigningOutcomeDeviceAuthenticationUnavailable
            DeviceProofSigningOutcomePairingRequired
            DeviceProofSigningOutcomeSigned
            DeviceProofSigningOutcomeUnexpectedFailure
            PairingRecord
            PairingRecordDeleteOutcome
            PairingRecordDeleteOutcomeDeleted
            PairingRecordDeleteOutcomeUnavailable
            PairingRecordReadOutcome
            PairingRecordReadOutcomeCorrupt
            PairingRecordReadOutcomeMissing
            PairingRecordReadOutcomePresent
            PairingRecordReadOutcomeUnavailable
            PairingRecordStore
            PairingRecordWriteOutcome
            PairingRecordWriteOutcomeStored
            PairingRecordWriteOutcomeUnavailable
          )
          for swift_name in "${required_swift_names[@]}"; do
            marker="__attribute__((swift_name(\"$swift_name\")))"
            if ! grep -Fq "$marker" "$device_header"; then
              echo "::error::Expected Swift protocol API is missing: $swift_name"
              exit 1
            fi
          done

      - name: Run iOS host tests
        working-directory: mobile
        run: |
          xcodebuild test \
            -project iosApp/RotkiCompanion.xcodeproj \
            -scheme RotkiCompanion \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -derivedDataPath iosApp/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO
