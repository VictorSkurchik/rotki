name: Mobile exact-decimal spike

on:
  pull_request:
    paths:
      - '.github/workflows/mobile_exact_decimal_spike.yml'
      - 'mobile/spikes/exact-decimal/**'
      - 'rotkehlchen/errors/serialization.py'
      - 'rotkehlchen/fval.py'
  push:
    branches:
      - main
      - master
      - develop
      - bugfixes
      - 'feature/**'
    paths:
      - '.github/workflows/mobile_exact_decimal_spike.yml'
      - 'mobile/spikes/exact-decimal/**'
      - 'rotkehlchen/errors/serialization.py'
      - 'rotkehlchen/fval.py'
  workflow_dispatch: { }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: { }

jobs:
  characterize:
    name: 'Python, JVM, and iOS parity'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14.4'

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95  # v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Select supported Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.4.app/Contents/Developer

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Verify Python FVal vectors
        run: python mobile/spikes/exact-decimal/python/generate_exact_decimal_vectors.py

      - name: Run JVM and iOS characterization
        working-directory: mobile/spikes/exact-decimal
        run: ./gradlew --no-daemon p02Check
